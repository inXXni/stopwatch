<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手拍秒表</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="秒表">
<link rel="manifest" href="./manifest.json">
<!-- iOS 不读 manifest 里的 icons，必须单独给 apple-touch-icon，否则主屏图标会变成网页截图 -->
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preload" href="./fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* DSEG7 Classic，七段数码管字体。SIL OFL 1.1，许可证见 fonts/DSEG-LICENSE.txt */
  @font-face {
    font-family: 'DSEG7';
    src: url('./fonts/DSEG7Classic-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    /* 字体没加载完就先不显示，避免先闪一下系统字体再跳成七段 */
    font-display: block;
  }

  :root {
    --ink-idle: #5a1818;
    --ink-running: #ff2d2d;
    --ink-done: #2dff6a;
    /* 没通电的段透出的暗色，LED 显示屏最有辨识度的细节 */
    --ghost-opacity: 0.12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    /* 以下五项缺一不可：拍击时任何一个默认行为被触发都会毁掉这一次计时 */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    /* 取边距与系统安全区的较大者，横屏时数字才不会被刘海挡住 */
    padding-top: max(4vmin, env(safe-area-inset-top, 0px));
    padding-right: max(4vmin, env(safe-area-inset-right, 0px));
    padding-bottom: max(4vmin, env(safe-area-inset-bottom, 0px));
    padding-left: max(4vmin, env(safe-area-inset-left, 0px));
  }

  /* viewBox 由 JS 按字体实际尺寸量出来，之后 SVG 自己等比缩放填满可用空间 */
  #display {
    width: 100%;
    height: 100%;
    color: var(--ink-idle);
    filter: drop-shadow(0 0 0.4vmin currentColor);
    transition: color 80ms linear;
  }

  #display text {
    font-family: 'DSEG7', monospace;
    font-size: 100px; /* 基准值，最终大小取决于 viewBox 缩放 */
    fill: currentColor;
  }

  /* 幽灵层垫在读数下面，两层右对齐叠放 */
  #ghost { opacity: var(--ghost-opacity); }

  #stage[data-state="RUNNING"] #display { color: var(--ink-running); }

  /* 默认全程红色，和实物 LED 牌一致 */
  #stage[data-state="LOCKED"]  #display,
  #stage[data-state="STOPPED"] #display { color: var(--ink-running); }

  /* 带 ?green 参数访问时，停表变绿，便于一眼看出表已经停了 */
  :root[data-green-stop] #stage[data-state="LOCKED"]  #display,
  :root[data-green-stop] #stage[data-state="STOPPED"] #display { color: var(--ink-done); }
</style>
</head>
<body>
  <div id="stage" data-state="IDLE">
    <svg id="display" preserveAspectRatio="xMidYMid meet" aria-label="计时显示">
      <text id="ghost" x="0" y="0" text-anchor="end">88.88</text>
      <text id="value" x="0" y="0" text-anchor="end">0.00</text>
    </svg>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手拍秒表</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="秒表">
<link rel="manifest" href="./manifest.json">
<!-- iOS 不读 manifest 里的 icons，必须单独给 apple-touch-icon，否则主屏图标会变成网页截图 -->
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
  :root {
    --ink-idle: #5a1818;
    --ink-running: #ff2d2d;
    --ink-done: #2dff6a;
    /* 没点亮的段透出的暗色，LED 显示屏最有辨识度的细节 */
    --ghost-opacity: 0.1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    /* 以下五项缺一不可：拍击时任何一个默认行为被触发都会毁掉这一次计时 */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    /* 取边距与系统安全区的较大者，横屏时数字才不会被刘海挡住 */
    padding-top: max(4vmin, env(safe-area-inset-top, 0px));
    padding-right: max(4vmin, env(safe-area-inset-right, 0px));
    padding-bottom: max(4vmin, env(safe-area-inset-bottom, 0px));
    padding-left: max(4vmin, env(safe-area-inset-left, 0px));
  }

  /* SVG 按 viewBox 等比缩放填满可用空间，不需要再算字号，各种屏幕天然适配 */
  #display {
    width: 100%;
    height: 100%;
    color: var(--ink-idle);
    filter: drop-shadow(0 0 0.45vmin currentColor);
    transition: color 80ms linear;
  }

  .seg {
    fill: currentColor;
    opacity: var(--ghost-opacity);
  }

  .seg.on { opacity: 1; }

  #stage[data-state="RUNNING"] #display { color: var(--ink-running); }
  #stage[data-state="LOCKED"]  #display,
  #stage[data-state="STOPPED"] #display { color: var(--ink-done); }
</style>
</head>
<body>
  <div id="stage" data-state="IDLE">
    <svg id="display" preserveAspectRatio="xMidYMid meet" aria-label="计时显示"></svg>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>

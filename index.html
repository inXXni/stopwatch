<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手拍秒表</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="秒表">
<link rel="manifest" href="./manifest.json">
<script>
  // 按地址参数选用对应的 manifest：每种组合一份，各自写明 start_url，
  // 安装到桌面的图标才会打开对应模式，名字也互不相同。四份文件由 npm run manifests 生成，
  // 文件名规则与名字必须和 tools/make-manifests.mjs 保持一致。
  (() => {
    const q = new URLSearchParams(location.search);
    const pk = q.has('pk');
    const green = q.has('green');
    if (!pk && !green) return;
    document.querySelector('link[rel="manifest"]').href =
      './manifest' + (pk ? '-pk' : '') + (green ? '-green' : '') + '.json';
    document.querySelector('meta[name="apple-mobile-web-app-title"]').content =
      (pk ? 'PK 秒表' : '秒表') + (green ? ' 绿' : '');
  })();
</script>
<!-- iOS 不读 manifest 里的 icons，必须单独给 apple-touch-icon，否则主屏图标会变成网页截图 -->
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preload" href="./fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* DSEG7 Classic，七段数码管字体。SIL OFL 1.1，许可证见 fonts/DSEG-LICENSE.txt */
  @font-face {
    font-family: 'DSEG7';
    src: url('./fonts/DSEG7Classic-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    /* 字体没加载完就先不显示，避免先闪一下系统字体再跳成七段 */
    font-display: block;
  }

  :root {
    /* 点亮的数字。待机、计时、定格三态同色——实物 LED 牌待机时 00.00 也是亮着的 */
    --ink: #ff2d2d;
    /* 带 ?green 时定格后转成的颜色 */
    --ink-green: #2dff6a;
    /* 没通电的段透出的暗色，LED 显示屏最有辨识度的细节 */
    --ghost-opacity: 0.12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    /* 以下五项缺一不可：拍击时任何一个默认行为被触发都会毁掉这一次计时 */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    /* 取边距与系统安全区的较大者，横屏时数字才不会被刘海挡住 */
    padding-top: max(4vmin, env(safe-area-inset-top, 0px));
    padding-right: max(4vmin, env(safe-area-inset-right, 0px));
    padding-bottom: max(4vmin, env(safe-area-inset-bottom, 0px));
    padding-left: max(4vmin, env(safe-area-inset-left, 0px));
  }

  .slot {
    flex: 1;
    /* flex 子项默认 min-height:auto，内容会把容器撑破，必须显式归零 */
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 不带 ?pk 时只留一格，占满整屏，外观与单人模式完全一致 */
  :root:not([data-pk]) .slot:nth-child(2) { display: none; }

  /* viewBox 由 JS 按字体实际尺寸量出来，之后 SVG 自己等比缩放填满可用空间 */
  .display {
    width: 100%;
    height: 100%;
    color: var(--ink);
    filter: drop-shadow(0 0 0.4vmin currentColor);
    transition: color 80ms linear;
  }

  .display text {
    font-family: 'DSEG7', monospace;
    font-size: 100px; /* 基准值，最终大小取决于 viewBox 缩放 */
    fill: currentColor;
  }

  /* 幽灵层垫在读数下面，两层右对齐叠放 */
  .ghost { opacity: var(--ghost-opacity); }

  /* 三态同色，所以不按 slot-state 分别着色。data-slot-state 仍要写在 DOM 上，
     下面那条 ?green 规则靠它认出「已定格」那一格。 */

  /* ?green：停表变绿。两种模式都吃这个参数，PK 下两格各自定格后分别变绿 */
  :root[data-green-stop] .slot[data-slot-state="done"] .display {
    color: var(--ink-green);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="slot" data-slot-state="empty">
      <svg class="display" preserveAspectRatio="xMidYMid meet" aria-label="选手一计时">
        <text class="ghost" x="0" y="0" text-anchor="end">88.88</text>
        <text class="value" x="0" y="0" text-anchor="end">0.00</text>
      </svg>
    </div>
    <div class="slot" data-slot-state="empty">
      <svg class="display" preserveAspectRatio="xMidYMid meet" aria-label="选手二计时">
        <text class="ghost" x="0" y="0" text-anchor="end">88.88</text>
        <text class="value" x="0" y="0" text-anchor="end">0.00</text>
      </svg>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>

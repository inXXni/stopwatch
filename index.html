<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手拍秒表</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="秒表">
<style>
  :root {
    --ink-idle: #4a1414;
    --ink-running: #ff2d2d;
    --ink-done: #2dff6a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    /* 以下五项缺一不可：拍击时任何一个默认行为被触发都会毁掉这一次计时 */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #display {
    /* 等宽数字：比例字形下 1 比 8 窄，计时过程中数字会持续左右抖动 */
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    /* 按 5 个等宽字符（12.34）占满约 90% 宽度反推字号，同时限制高度不溢出 */
    font-size: min(30vw, 55vh);
    color: var(--ink-idle);
    text-shadow: 0 0 0.12em currentColor, 0 0 0.3em currentColor;
    transition: color 80ms linear;
  }

  /* 待机态颜色暗，用同样强的光晕会显得发糊，单独减弱一档 */
  #stage[data-state="IDLE"] #display { text-shadow: 0 0 0.1em currentColor; }

  #stage[data-state="RUNNING"] #display { color: var(--ink-running); }
  #stage[data-state="LOCKED"]  #display,
  #stage[data-state="STOPPED"] #display { color: var(--ink-done); }
</style>
</head>
<body>
  <div id="stage" data-state="IDLE">
    <div id="display">0.00</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>

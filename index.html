<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手拍秒表</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="秒表">
<script>
  // 按地址参数插入对应的 manifest 链接：每种组合一份，各自写明 start_url，
  // 安装到桌面的图标才会打开对应模式，名字也互不相同。文件由 npm run manifests 生成，
  // 文件名规则与名字必须和 tools/make-manifests.mjs 保持一致。
  // PK 模式忽略 green：红蓝是阵营色，停表变绿会把阵营抹掉，?pk&green 按 ?pk 处理。
  //
  // 链接不能先写死一份默认的再改 href：Safari 一看到第一个 manifest 链接就立刻加载并
  // 记住它，之后改 href 不会重新加载，iPad / iPhone「添加到主屏幕」用的仍是默认那份，
  // 存下的地址不带参数。所以这里按参数一次插入正确的那一份。
  (() => {
    const q = new URLSearchParams(location.search);
    const pk = q.has('pk');
    const green = q.has('green');
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = pk ? './manifest-pk.json' : green ? './manifest-green.json' : './manifest.json';
    document.head.append(link);
    if (pk || green) {
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content =
        pk ? 'PK 秒表' : '秒表 绿';
    }
  })();
</script>
<!-- iOS 不读 manifest 里的 icons，必须单独给 apple-touch-icon，否则主屏图标会变成网页截图 -->
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preload" href="./fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* DSEG7 Classic，七段数码管字体。SIL OFL 1.1，许可证见 fonts/DSEG-LICENSE.txt */
  @font-face {
    font-family: 'DSEG7';
    src: url('./fonts/DSEG7Classic-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    /* 字体没加载完就先不显示，避免先闪一下系统字体再跳成七段 */
    font-display: block;
  }

  :root {
    /* 点亮的数字。待机、计时、定格三态同色——实物 LED 牌待机时 00.00 也是亮着的。
       PK 模式下是上格（红方）的颜色 */
    --ink: #ff2d2d;
    /* PK 模式下格（蓝方）的颜色。蓝色在黑底上天然显得比红色暗，两方亮度不等会削弱
       公平感，所以挑相对亮度接近的：#ff2d2d 为 0.233，#3d8bff 为 0.267 */
    --ink-blue: #3d8bff;
    /* 带 ?green 时定格后转成的颜色，只用于普通模式 */
    --ink-green: #2dff6a;
    /* 停表冲击环：各自数字颜色的浅色版（与白色约七三混合），压在同色数字上也看得见 */
    --ink-hit: #ffc2bd;
    --ink-blue-hit: #c4dcff;
    --ink-green-hit: #c0ffd2;
    /* PK 模式中间「VS」的颜色，与两侧细线的颜色 */
    --ink-vs: #ffb020;
    --rule: #3a3a3a;
    /* 没通电的段透出的暗色，LED 显示屏最有辨识度的细节 */
    --ghost-opacity: 0.12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    /* 以下五项缺一不可：拍击时任何一个默认行为被触发都会毁掉这一次计时 */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative; /* 停表冲击环的定位容器 */
    /* 取边距与系统安全区的较大者，横屏时数字才不会被刘海挡住 */
    padding-top: max(4vmin, env(safe-area-inset-top, 0px));
    padding-right: max(4vmin, env(safe-area-inset-right, 0px));
    padding-bottom: max(4vmin, env(safe-area-inset-bottom, 0px));
    padding-left: max(4vmin, env(safe-area-inset-left, 0px));
  }

  .slot {
    flex: 1;
    /* flex 子项默认 min-height:auto，内容会把容器撑破，必须显式归零 */
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 颜色挂在格子上，数字和色条都用 currentColor 跟着走 */
    color: var(--ink);
    --hit: var(--ink-hit); /* 停表冲击环与放射线的颜色 */
    transition: color 80ms linear;
  }

  /* 不带 ?pk 时只留一格，占满整屏，外观与单人模式完全一致 */
  :root:not([data-pk]) :is(.slot[data-side="blue"], .vs, .stripe) { display: none; }

  /* viewBox 由 JS 按字体实际尺寸量出来，之后 SVG 自己等比缩放填满可用空间。
     用 flex 占满色条以外的宽度；min-width 归零，否则 SVG 不肯收窄给色条让位 */
  .display {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    filter: drop-shadow(0 0 0.4vmin currentColor);
  }

  .display text {
    font-family: 'DSEG7', monospace;
    font-size: 100px; /* 基准值，最终大小取决于 viewBox 缩放 */
    fill: currentColor;
  }

  /* 幽灵层垫在读数下面，两层右对齐叠放 */
  .ghost { opacity: var(--ghost-opacity); }

  /* 数字三态同色，所以不按 slot-state 分别着色。data-slot-state 仍要写在 DOM 上，
     ?green 规则靠它认出「已定格」那一格，PK 的色条靠它决定亮、暗还是闪。 */

  /* ?green：停表变绿，只对普通模式生效（PK 模式下 app.js 不设 data-green-stop） */
  :root[data-green-stop] .slot[data-slot-state="done"] {
    color: var(--ink-green);
  }

  /* 停表爆裂的两道冲击环与放射线：停表时 hit.js 把它们挪到这一格数字的中心，从那里扩散出去。
     平时不可见。两格的数字带 filter，各自成层，要提一层才能盖住另一格的数字；
     PK 模式下 VS 再高一层，压在上面。见 docs/superpowers/specs/2026-10-29-stop-burst-design.md */
  .hit-ring {
    position: absolute;
    z-index: 1;
    width: 0;
    height: 0;
    border: 0 solid var(--hit);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }

  /* 放射线的 SVG 宽高与 viewBox 都是 120，线的坐标与线宽因此直接是 vmin */
  .hit-lines {
    position: absolute;
    z-index: 1;
    width: 120vmin;
    height: 120vmin;
    overflow: visible;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    stroke: var(--hit);
    stroke-width: 0.8;
    stroke-linecap: round;
  }

  /* 带 ?green 时停表这一刻数字转绿，环与放射线跟着用浅绿（只出现在普通模式） */
  :root[data-green-stop] .slot { --hit: var(--ink-green-hit); }

  /* PK 模式：上格红方、下格蓝方，各状态下都是阵营色 */
  :root[data-pk] .slot[data-side="blue"] { color: var(--ink-blue); --hit: var(--ink-blue-hit); }

  /* 两格之间的 VS 分隔条 */
  .vs {
    flex: none;
    height: 8vmin;
    display: flex;
    align-items: center;
    gap: 3vmin;
    color: var(--ink-vs);
    font: 500 5vmin/1 system-ui, sans-serif;
  }

  .vs::before,
  .vs::after {
    content: '';
    flex: 1;
    height: 2px;
    background: var(--rule);
  }

  /* VS 分三层：.vs-box 是黑底与冲击环的定位容器，.vs-text 是文字，.vs-ring 是冲击环。
     新一轮开始时 slam.js 让文字砸下来、冲击环扩散，黑底不动。
     见 docs/superpowers/specs/2026-10-29-vs-slam-design.md */
  .vs-box {
    position: relative;
    z-index: 2; /* 砸入的冲击环要盖在两格上面，VS 也要压住停表冲击环（z-index 1） */
  }

  /* 行内元素不能做 transform，砸入的缩放旋转要求块级盒 */
  .vs-text { display: inline-block; }

  /* 平时尺寸为 0、不可见；尺寸、线宽、不透明度都由砸入动画给出 */
  .vs-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    border: 0 solid #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }

  /* 左侧色条：从轮到这一格起一直闪，停表才常亮，还没轮到的变暗。
     高度由 app.js 按数字的实际渲染高度设置，量到之前先不显示 */
  .stripe {
    flex: none;
    width: 1.5vmin;
    height: 0;
    margin-right: 2.5vmin;
    border-radius: 0.75vmin;
    background: currentColor;
  }

  .slot[data-slot-state="empty"] .stripe { opacity: 0.2; }

  /* 轮到与计时中用同一条 animation，切换时浏览器不会让动画重新起跳 */
  .slot:is([data-slot-state="next"], [data-slot-state="running"]) .stripe {
    animation: stripe-pulse 0.8s ease-in-out infinite alternate;
  }

  @keyframes stripe-pulse {
    from { opacity: 1; }
    to { opacity: 0.15; }
  }

  /* ---- PK 的 VS 按屏幕分三种排法 ----
     宽屏横屏：VS 移到左侧，与两根色条连成一根竖脊，两行之间只留窄缝。手机横屏受高度限制，
     两侧本来空着，VS 放在那里不占数字的地方，两行靠拢后数字反而更大。
     竖屏：数字受宽度限制，上下本来空着，VS 留在中间放大。
     其余横屏（iPad 等接近方形的屏幕）：两侧没有空白，保持上面的原样。 */

  @media (orientation: portrait), (orientation: landscape) and (min-aspect-ratio: 16/9) {
    :root[data-pk] .vs-text { text-shadow: 0 0 1.2vmin rgba(255, 176, 32, 0.5); }
  }

  @media (orientation: portrait) {
    :root[data-pk] .vs {
      height: 15vmin;
      gap: 4vmin;
      font: italic 900 11vmin/1 system-ui, sans-serif;
    }
    :root[data-pk] .vs::before,
    :root[data-pk] .vs::after { height: 0.5vmin; }
  }

  /* 色条脊柱：每行是「脊柱列 26vmin + 间距 2.5vmin + 数字框」，整组水平居中。
     数字框宽度由 app.js 按字体量出的 viewBox 算好：每格的 --w 写在各自的 SVG 上，
     两格中较宽的 --digits-w 写在 #stage 上。两格与 VS 这一行用同一份左右留白，
     色条和 VS 才落在同一条竖线上；数字靠右，两格位数不同时小数点仍上下对齐。 */
  @media (orientation: landscape) and (min-aspect-ratio: 16/9) {
    :root[data-pk] :is(.slot, .vs) {
      justify-content: flex-start;
      padding-inline: max(0px, calc((100% - 28.5vmin - var(--digits-w, 0px)) / 2));
    }
    :root[data-pk] .stripe { margin-left: 12.25vmin; margin-right: 14.75vmin; }
    :root[data-pk] .display { flex: none; width: var(--w, 0px); margin-left: auto; }

    /* 两行之间的窄缝就是 VS 这一行。VS 比它高，上下溢出，正好压在两根色条的接缝上 */
    :root[data-pk] .vs {
      height: 3vmin;
      gap: 0;
      font: italic 900 18vmin/1 system-ui, sans-serif;
    }
    :root[data-pk] .vs::before,
    :root[data-pk] .vs::after { display: none; }
    /* 黑底把两根色条在接缝处截断 */
    :root[data-pk] .vs-box {
      flex: none;
      width: 26vmin;
      padding-block: 1vmin;
      text-align: center;
      background: #000;
    }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="slot" data-side="red" data-slot-state="empty">
      <div class="stripe"></div>
      <svg class="display" preserveAspectRatio="xMidYMid meet" aria-label="选手一计时">
        <text class="ghost" x="0" y="0" text-anchor="end">88.88</text>
        <text class="value" x="0" y="0" text-anchor="end">0.00</text>
      </svg>
      <span class="hit-ring"></span>
      <span class="hit-ring"></span>
      <svg class="hit-lines" viewBox="-60 -60 120 120" aria-hidden="true"></svg>
    </div>
    <div class="vs" aria-hidden="true"><span class="vs-box"><span class="vs-text">VS</span><span class="vs-ring"></span></span></div>
    <div class="slot" data-side="blue" data-slot-state="empty">
      <div class="stripe"></div>
      <svg class="display" preserveAspectRatio="xMidYMid meet" aria-label="选手二计时">
        <text class="ghost" x="0" y="0" text-anchor="end">88.88</text>
        <text class="value" x="0" y="0" text-anchor="end">0.00</text>
      </svg>
      <span class="hit-ring"></span>
      <span class="hit-ring"></span>
      <svg class="hit-lines" viewBox="-60 -60 120 120" aria-hidden="true"></svg>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
